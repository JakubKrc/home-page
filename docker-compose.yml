services:
  home-page:
    image: nginx:alpine
    container_name: homepage
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./html:/usr/share/nginx/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot
    restart: always
    networks:
      - apps_net

networks:
  apps_net:
    external: true