# PREDECO's old address. The app builds its links from one domain, so this one only forwards.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name predeco.jkjdev.eu;

    ssl_certificate /etc/letsencrypt/live/predeco/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/predeco/privkey.pem;

    server_tokens off;

    return 301 https://predeco-beta.wai.blue$request_uri;
}

# PREDECO - Hubleto PHP app, PHP runs in the host's php8.5-fpm (same setup as njf-funding).
# The domain belongs to someone else, so HSTS stays without includeSubDomains.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name predeco-beta.wai.blue;

    ssl_certificate /etc/letsencrypt/live/predeco/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/predeco/privkey.pem;

    server_tokens off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    root /usr/share/nginx/predeco;
    index index.php;

    # Excel imports are allowed up to 5 MB.
    client_max_body_size 6m;

    location / {
        try_files $uri $uri/ @rewrite;
    }

    location @rewrite {
        rewrite ^/(.*)$ /index.php?route=$1 last;
    }

    # Only the front controller runs. install.php drops the database,
    # so no other script may ever be reachable from the web.
    location = /index.php {
        fastcgi_pass 172.20.0.1:9000;
        fastcgi_param SCRIPT_FILENAME /home/docker-user/predeco/index.php;
        include fastcgi_params;
    }

    location ~ \.php$ {
        return 403;
    }

    # Server-side folders. Logs and guides are sent by PREDECO itself,
    # only to signed-in users, so the files are never served directly.
    location ~ ^/(src|tmp|examples|log|guides)/ {
        deny all;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
