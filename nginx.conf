limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
limit_req_status 429;

server {
    listen 80;
    listen [::]:80;

    server_name jkjdev.eu www.jkjdev.eu shop.ubo.jkjdev.eu admin.ubo.jkjdev.eu;

    # so certbot can use port 80 for renewal of SSL cert
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name jkjdev.eu www.jkjdev.eu;

    ssl_certificate /etc/letsencrypt/live/jkjdev.eu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jkjdev.eu/privkey.pem;

    resolver 127.0.0.11 ipv6=off;

    server_tokens off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; img-src 'self' data:; font-src 'self' data: https://cdnjs.cloudflare.com; connect-src 'self' https://api.github.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://formspree.io" always;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ =404;
    }

    location /crud-for-testing/ {
        limit_req zone=api burst=20 nodelay;

        proxy_pass http://crud-app-frontend-1:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_next_upstream error timeout invalid_header http_500 http_502 http_503;
    }

    location /planet-far-away-js/ {
        rewrite ^/planet-far-away-js/(.*)$ /$1 break;
        proxy_pass http://planet-far-away-js:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_next_upstream error timeout invalid_header http_500 http_502 http_503;
    }

    location /mandelbrot/ {
        rewrite ^/mandelbrot/(.*)$ /$1 break;
        proxy_pass http://mandelbrot:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_next_upstream error timeout invalid_header http_500 http_502 http_503;
    }

    location /2d-platformer-engine-prototype/ {
        rewrite ^/2d-platformer-engine-prototype/(.*)$ /$1 break;
        proxy_pass http://2d-platformer-engine-prototype:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_next_upstream error timeout invalid_header http_500 http_502 http_503;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name shop.ubo.jkjdev.eu;

    ssl_certificate /etc/letsencrypt/live/jkjdev.eu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jkjdev.eu/privkey.pem;

    resolver 127.0.0.11 ipv6=off;

    server_tokens off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 32m;

    location / {
        proxy_pass http://ubo-shop-shop-1:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

