limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
limit_req_status 429;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# HEALTHCARE: Hubleto reads its route from ?route=, so "/healthcare/customers/2" becomes route "customers/2".
map $uri $healthcare_route {
    "~^/healthcare/(?<healthcare_path>.*)$" $healthcare_path;
    default "";
}

# MIOMED-SPEC: second Hubleto instance (the 72-page MioMed specification), same routing as HEALTHCARE.
map $uri $miomed_spec_route {
    "~^/miomed-spec/(?<miomed_spec_path>.*)$" $miomed_spec_path;
    default "";
}

# HLTHCR: third Hubleto instance (shared MioMed + Medison core, demo for colleagues and customers), same routing.
map $uri $hlthcr_route {
    "~^/hlthcr/(?<hlthcr_path>.*)$" $hlthcr_path;
    default "";
}


server {
    listen 80;
    listen [::]:80;

    server_name jkjdev.eu www.jkjdev.eu shop.ubo.jkjdev.eu admin.ubo.jkjdev.eu njf-funding.jkjdev.eu predeco.jkjdev.eu predeco-beta.wai.blue;

    # so certbot can use port 80 for renewal of SSL cert
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name jkjdev.eu www.jkjdev.eu;

    ssl_certificate /etc/letsencrypt/live/jkjdev.eu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jkjdev.eu/privkey.pem;

    resolver 127.0.0.11 ipv6=off;

    server_tokens off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; img-src 'self' data:; font-src 'self' data: https://cdnjs.cloudflare.com; connect-src 'self' https://api.github.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://formspree.io" always;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ =404;
    }

    location /crud-for-testing/ {
        limit_req zone=api burst=20 nodelay;

        proxy_pass http://crud-app-frontend-1:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_next_upstream error timeout invalid_header http_500 http_502 http_503;
    }

    location /planet-far-away-js/ {
        rewrite ^/planet-far-away-js/(.*)$ /$1 break;
        proxy_pass http://planet-far-away-js:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_next_upstream error timeout invalid_header http_500 http_502 http_503;
    }

    location /mandelbrot/ {
        rewrite ^/mandelbrot/(.*)$ /$1 break;
        proxy_pass http://mandelbrot:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_next_upstream error timeout invalid_header http_500 http_502 http_503;
    }

    location /grauwolf/ {
        proxy_pass http://grauwolf:8080/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /2d-platformer-engine-prototype/ {
        rewrite ^/2d-platformer-engine-prototype/(.*)$ /$1 break;
        proxy_pass http://2d-platformer-engine-prototype:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_next_upstream error timeout invalid_header http_500 http_502 http_503;
    }

    # HEALTHCARE - test server of the MioMed rewrite (Hubleto PHP app), PHP runs in the host's php8.5-fpm like PREDECO.
    location = /healthcare {
        return 301 /healthcare/;
    }

    location ^~ /healthcare/ {
        # A location with own add_header drops the server's headers, so all are repeated here.
        # Hubleto needs inline scripts and eval (same as PREDECO) and frames itself (categorisation preview).
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

        root /usr/share/nginx/sites;
        client_max_body_size 20m;

        # Only the front controller runs. install.php and "hubleto init" drop the database.
        location = /healthcare/index.php {
            fastcgi_pass 172.20.0.1:9000;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /home/docker-user/hubleto-healthcare/index.php;
        }

        location ~ \.php$ {
            return 403;
        }

        # Server-side folders and files. nginx ignores Hubleto's .htaccess files (upload/ will hold medical scans).
        location ~ ^/healthcare/(src|log|tmp|secure|upload|node_modules)/ {
            deny all;
        }

        location ~ ^/healthcare/([^/]+\.(yaml|yml|json|lock|md|sh|js|ts|tsx|twcss|txt)|hubleto)$ {
            deny all;
        }

        location ~ /\. {
            deny all;
        }

        try_files $uri /healthcare/index.php?route=$healthcare_route&$args;
    }

    # MIOMED-SPEC - the 72-page MioMed specification built on Hubleto (separate instance), set up like HEALTHCARE.
    location = /miomed-spec {
        return 301 /miomed-spec/;
    }

    location ^~ /miomed-spec/ {
        # A location with own add_header drops the server's headers, so all are repeated here.
        # Hubleto needs inline scripts and eval (same as PREDECO) and frames itself (categorisation preview).
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

        root /usr/share/nginx/sites;
        client_max_body_size 20m;

        # Only the front controller runs. install.php and "hubleto init" drop the database.
        location = /miomed-spec/index.php {
            fastcgi_pass 172.20.0.1:9000;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /home/docker-user/hubleto-miomed-spec/index.php;
        }

        location ~ \.php$ {
            return 403;
        }

        # Server-side folders and files. nginx ignores Hubleto's .htaccess files (upload/ will hold medical scans).
        location ~ ^/miomed-spec/(src|log|tmp|secure|upload|node_modules)/ {
            deny all;
        }

        location ~ ^/miomed-spec/([^/]+\.(yaml|yml|json|lock|md|sh|js|ts|tsx|twcss|txt)|hubleto)$ {
            deny all;
        }

        location ~ /\. {
            deny all;
        }

        try_files $uri /miomed-spec/index.php?route=$miomed_spec_route&$args;
    }

    # HLTHCR - shared MioMed + Medison core built on Hubleto (separate instance), set up like HEALTHCARE.
    location = /hlthcr {
        return 301 /hlthcr/;
    }

    location ^~ /hlthcr/ {
        # A location with own add_header drops the server's headers, so all are repeated here.
        # Hubleto needs inline scripts and eval (same as PREDECO) and frames itself.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

        root /usr/share/nginx/sites;
        client_max_body_size 20m;

        # Only the front controller runs. install.php and "hubleto init" drop the database.
        location = /hlthcr/index.php {
            fastcgi_pass 172.20.0.1:9000;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /home/docker-user/hubleto-hlthcr/index.php;
        }

        location ~ \.php$ {
            return 403;
        }

        # Server-side folders and files. nginx ignores Hubleto's .htaccess files (upload/ will hold medical scans).
        location ~ ^/hlthcr/(src|log|tmp|secure|upload|node_modules)/ {
            deny all;
        }

        location ~ ^/hlthcr/([^/]+\.(yaml|yml|json|lock|md|sh|js|ts|tsx|twcss|txt)|hubleto)$ {
            deny all;
        }

        location ~ /\. {
            deny all;
        }

        try_files $uri /hlthcr/index.php?route=$hlthcr_route&$args;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name shop.ubo.jkjdev.eu;

    ssl_certificate /etc/letsencrypt/live/jkjdev.eu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jkjdev.eu/privkey.pem;

    resolver 127.0.0.11 ipv6=off;

    server_tokens off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 32m;

    # Switched off: the ubo-shop-shop-1 container is stopped until it is rebuilt on a patched PHP.
    # Proxying to a stopped container would stop nginx from starting at all.
    return 503;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name admin.ubo.jkjdev.eu;

    ssl_certificate /etc/letsencrypt/live/jkjdev.eu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jkjdev.eu/privkey.pem;

    resolver 127.0.0.11 ipv6=off;

    server_tokens off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    # Livewire/Alpine.js inherently need unsafe-inline (bootstrap scripts)
    # and unsafe-eval (wire:submit expressions evaluated via new Function()).
    # Laravel's Blade auto-escaping is the primary XSS defense.
    # fonts.bunny.net is used by the Livewire starter kit for Instrument Sans.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.bunny.net; img-src 'self' data: https://avatars.githubusercontent.com; font-src 'self' data: https://fonts.bunny.net; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://github.com" always;

    client_max_body_size 8m;

    # Switched off: the ubo-admin container is stopped until it is rebuilt on a patched PHP.
    # Proxying to a stopped container would stop nginx from starting at all.
    return 503;
}

