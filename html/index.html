<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JKJ dev</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <script src="loadJSON.js"></script>
</head>
<body>

  <nav>
    <div class="left">
      <button id="theme-toggle">
          <i class="fa-solid fa-moon"></i>
          Dark mode
      </button>
    </div>
    <div class="right">

      <a href="https://github.com/JakubKrc" target="_blank" rel="noopener noreferrer">
        <i class="fa-brands fa-github"></i>
        <span>Github</span>
      </a>

      <a href="javascript:void(0)" id="email-button">
        <i class="fa-solid fa-envelope"></i>
        <span>Email</span>
      </a>

    </div>
  </nav>

  <h1>Welcome!</h1>

  <div id="repos-container"></div>

  <form action="https://formspree.io/f/mwpddgqp" method="POST" id="contact-form">
    <h2>Contact Me</h2>
    <input type="text" name="name" placeholder="Name" required>
    <input type="email" name="email" placeholder="Email" required required pattern="[^@\s]+@[^@\s]+\.[^@\s]+">
    <textarea name="message" placeholder="Message" required></textarea>
    <button type="submit">Send</button>
    <p id="form-msg"></p>
    <small style="display:block; margin-top:5px; color:--text-color; font-size:12px;">
      By submitting, your message is sent via a third-party service (<a href="https://formspree.io/security" target="_blank" rel="noopener">Formspree</a>).
    </small>
  </form>


  <script src="main.js"></script>

</body>

</html>
